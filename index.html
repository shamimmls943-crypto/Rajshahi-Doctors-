function wUI(){const e=$("wt");if(!e)return;const n=wGet();e.innerHTML=Array.from({length:8},(_,i)=>`<span class="${i<n?"on":""}">💧</span>`).join("");$("wm").textContent=`${bn(n)} গ্লাস পান করেছেন • সাধারণ লক্ষ্য ${bn(8)} গ্লাস (প্রয়োজন ব্যক্তিভেদে ভিন্ন)`}
function nSave(v){try{localStorage.setItem("rnote",v)}catch(e){}}
function nUI(){const e=$("nt");if(!e)return;try{e.value=localStorage.getItem("rnote")||""}catch(err){}}

function navH(){const n=document.querySelector("nav");if(n)document.documentElement.style.setProperty("--nh",n.offsetHeight+"px")}navH();addEventListener("resize",navH);
home();badge();
